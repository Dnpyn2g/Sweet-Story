name: Build & Commit

# Triggered on every push to main, EXCEPT when the commit message contains
# [skip ci] (our own auto-commits use this marker to avoid loops).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required so the bot can push the regenerated artefacts back

concurrency:
  group: build-and-commit
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can commit-and-push from the workflow.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate static artefacts
        run: python -X utf8 build.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/chunks stories sitemap.xml robots.txt story1/index.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: rebuild static site [skip ci]"
          git push origin HEAD:main
