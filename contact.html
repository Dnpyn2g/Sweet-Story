<style>
  .static-page { max-width: 720px; margin: 30px auto; padding: 30px; background: var(--surface-color, #fff); border-radius: var(--border-radius); box-shadow: var(--shadow); }
  .static-page h1 { margin-bottom: 20px; }
  .static-page h2 { margin: 28px 0 10px; }
  .static-page p, .static-page li { line-height: 1.7; margin-bottom: 8px; }
  .static-page ul { padding-left: 22px; margin-bottom: 18px; list-style: none; }
  .static-page a { color: var(--primary-color); }
  .feedback-form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .feedback-form label { font-weight: 600; }
  .feedback-form input, .feedback-form textarea {
    padding: 12px; border: 1px solid var(--border-color, #ddd);
    border-radius: 8px; font-size: 1rem; font-family: inherit;
    background: var(--surface-color, #fff); color: var(--secondary-color, #333);
  }
  .feedback-form input:focus, .feedback-form textarea:focus {
    outline: none; border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(255,140,0,0.15);
  }
  .feedback-form textarea { min-height: 120px; resize: vertical; }
  .feedback-form button {
    padding: 12px 24px; border: none; border-radius: 999px;
    background: var(--primary-color); color: #fff; font-weight: 700;
    cursor: pointer; font-size: 1rem;
  }
  .feedback-form button:hover { background: #b8741a; }
  .feedback-status { margin-top: 10px; color: var(--muted-color); }
  [data-theme="dark"] .static-page { background: #1e1e1e; color: var(--secondary-color); }
</style>

<body>
<header class="site-header">
  <div class="container">
    <img src="/images/Cupcake.svg" alt="" class="cupcake-left" width="50" height="50" aria-hidden="true">
    <a href="/" class="logo">SWEET-STORY</a>
    <img src="/images/Cupcake.svg" alt="" class="cupcake-right" width="50" height="50" aria-hidden="true">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" aria-pressed="false">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<main class="container">
  <article class="static-page">
    <h1>Контакты</h1>
    <p>Если у вас есть вопросы, предложения или своя история — мы будем рады услышать.</p>

    <h2>Написать нам</h2>
    <ul>
      <li><strong>Email:</strong> <a href="mailto:dnpyn2g@outlook.com">dnpyn2g@outlook.com</a></li>
    </ul>

    <h2>Форма обратной связи</h2>
    <form class="feedback-form" id="contact-form" novalidate>
      <label for="name">Ваше имя</label>
      <input type="text" id="name" name="name" placeholder="Как к вам обращаться" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" required>

      <label for="message">Сообщение</label>
      <textarea id="message" name="message" placeholder="Поделитесь идеей, отзывом или историей" required></textarea>

      <button type="submit">Отправить</button>
      <p class="feedback-status" id="feedback-status" role="status" aria-live="polite"></p>
    </form>
  </article>
</main>

<footer class="site-footer">
  <div class="container">© 2025 Sweet Story · <a href="/privacy.html">Конфиденциальность</a></div>
</footer>

<script>
  // The form has no backend — it composes a mailto: link with the user's
  // message and opens it in the mail client. No data leaves the browser.
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var mail = document.getElementById('email').value.trim();
    var msg  = document.getElementById('message').value.trim();
    var status = document.getElementById('feedback-status');

    if (!name || !mail || !msg) {
      status.textContent = 'Пожалуйста, заполните все поля.';
      return;
    }

    var subject = encodeURIComponent('Sweet Story — отзыв от ' + name);
    var body    = encodeURIComponent(msg + '\n\n---\nОт: ' + name + ' <' + mail + '>');
    window.location.href = 'mailto:dnpyn2g@outlook.com?subject=' + subject + '&body=' + body;

    status.textContent = 'Спасибо! Открываем ваш почтовый клиент…';
    if (window.gaTrack) window.gaTrack('feedback_submit', {});
  });
</script>
</body>
