name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run build.py
        run: python -X utf8 build.py

      - name: Prepare site directory
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='_site' \
            --exclude='uploads' \
            --exclude='logs' \
            --exclude='state.json' \
            --exclude='posting.log' \
            --exclude='posting.py' \
            --exclude='sk.py' \
            --exclude='build.py' \
            --exclude='story_ids.txt' \
            --exclude='sidebar_old.js' \
            --exclude='sidebar_optimized.js' \
            --exclude='data/stories-*.json' \
            --exclude='data/config.json' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
