  <div id="bottomBanner" class="bottom-banner" role="region" aria-label="Рекомендуемые материалы">
    <div class="banner-header">
      <h3 class="banner-title">Рекомендуемые материалы</h3>

    </div>

  <script>
    class BottomBanner {
      constructor() {
        this.banner = document.getElementById('bottomBanner');
        this.hideBtn = document.getElementById('hideBannerBtn');
        this.isVisible = false;
        this.showDelay = 3000;
        this._onTransitionEnd = this._onTransitionEnd.bind(this);
        this.init();
      }
      init() {
        setTimeout(() => this.show(), this.showDelay);
        if (this.hideBtn) this.hideBtn.addEventListener('click', () => this.hide());
        this.banner.addEventListener('transitionend', this._onTransitionEnd);
        window.addEventListener('resize', () => {
          if (this.isVisible) document.body.style.marginBottom = this.getBannerHeight();
        });
      }
      _onTransitionEnd(e) {
        if (e.target === this.banner && this.isVisible) this.loadMgidWidget();
      }
      show() {
        if (this.isVisible) return;
        this.banner.classList.add('show');
        this.isVisible = true;
        document.body.style.marginBottom = this.getBannerHeight();
        setTimeout(() => { if (window._mgq) this.loadMgidWidget(); }, 400);
      }
      hide() {
        if (!this.isVisible) return;
        this.banner.classList.remove('show');
        this.isVisible = false;
        document.body.style.marginBottom = '0';
      }
      getBannerHeight() {
        const w = window.innerWidth;
        if (w <= 480) return '70vh';
        if (w <= 768) return '60vh';
        return '50vh';
      }
      loadMgidWidget() {
        if (window._mgq) window._mgq.push(['_mgc.load']);
      }
      forceShow() { if (!this.isVisible) this.show(); }
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.bottomBanner = new BottomBanner();

      const container = document.getElementById('stories-container');
      const pagination = document.getElementById('pagination');
      const itemsPerPage = 12;
      let currentPage = 1;
      let lastLoadToken = 0;

      function createStoryCard(story, index = 0) {
        const card = document.createElement('article');
        card.className = 'story-card';

        const link = document.createElement('a');
        link.className = 'story-link';
        link.href = '/stories/' + encodeURIComponent(story.id);
        link.addEventListener('click', () => {
          if (window.gaTrack) {
            window.gaTrack('story_click', {
              item_id: String(story.id),
              item_name: story.title || '',
              content_type: 'story_card'
            });
          }
        });

        const thumb = document.createElement('div');
        thumb.className = 'story-thumb';

        const img = document.createElement('img');
        // The first 4 cards are above the fold on most viewports.
        // Eager-load them to give LCP a real image instead of a placeholder.
        if (index < 4) {
          img.loading = 'eager';
          if (index === 0) img.fetchPriority = 'high';
        } else {
          img.loading = 'lazy';
        }
        img.src = story.image;
        img.alt = story.title || 'Иллюстрация к истории';
        img.width = 600;
        img.height = 315;

        const title = document.createElement('h2');
        title.className = 'story-title';
        title.textContent = story.title || '';

        const excerpt = document.createElement('p');
        excerpt.className = 'story-excerpt';
        excerpt.textContent = story.excerpt || '';

        thumb.appendChild(img);
        link.appendChild(thumb);
        link.appendChild(title);
        link.appendChild(excerpt);
        if (story.read_time) {
          const meta = document.createElement('p');
          meta.className = 'story-meta-card';
          meta.textContent = '⏱ ~' + story.read_time + ' мин';
          link.appendChild(meta);
        }
        card.appendChild(link);
        return card;
      }

      function renderStories(stories) {
        container.replaceChildren();
        stories.forEach((story, i) => container.appendChild(createStoryCard(story, i)));
      }

      function renderPagination(activePage, total, meta = {}) {
        const { fullyLoaded = false } = meta;
        pagination.replaceChildren();
        if (total <= 1 && fullyLoaded) return;

        const makeBtn = (label, page, isActive = false, aria) => {
          const btn = document.createElement('button');
          btn.className = 'pager-btn' + (isActive ? ' active' : '');
          btn.textContent = label;
          if (aria) btn.setAttribute('aria-label', aria);
          if (isActive) btn.setAttribute('aria-current', 'page');
          btn.disabled = isActive;
          btn.addEventListener('click', () => handlePageRequest(page, label));
          return btn;
        };

        if (activePage > 1) pagination.appendChild(makeBtn('←', activePage - 1, false, 'Предыдущая страница'));
        pagination.appendChild(makeBtn('1', 1, activePage === 1, 'Страница 1'));

        const lastPage = total;
        const windowStart = Math.max(2, activePage - 2);
        const windowEnd = Math.min(lastPage, activePage + 2);

        if (windowStart > 2) {
          pagination.appendChild(Object.assign(document.createElement('span'), { className: 'ellipsis', textContent: '…' }));
        }
        for (let i = windowStart; i <= windowEnd; i++) {
          if (i >= lastPage) break;
          if (i <= 1) continue;
          pagination.appendChild(makeBtn(String(i), i, i === activePage, `Страница ${i}`));
        }
        if (lastPage > 1) {
          if (windowEnd < lastPage - 1) {
            pagination.appendChild(Object.assign(document.createElement('span'), { className: 'ellipsis', textContent: '…' }));
          }
          pagination.appendChild(makeBtn(String(lastPage), lastPage, activePage === lastPage, `Страница ${lastPage}`));
        }
        if (activePage < total) {
          pagination.appendChild(makeBtn('→', activePage + 1, false, 'Следующая страница'));
        }
      }

      function handlePageRequest(page, label) {
        if (window.gaTrack) window.gaTrack('pagination_click', { page: Number(page), label: String(label) });
        showPage(page);
      }

      function renderSkeletons(count) {
        container.replaceChildren();
        for (let i = 0; i < count; i++) {
          const sk = document.createElement('article');
          sk.className = 'story-card skeleton-card';
          sk.innerHTML =
            '<div class="story-thumb skeleton-block"></div>' +
            '<div class="skeleton-line skeleton-line-title"></div>' +
            '<div class="skeleton-line skeleton-line-text"></div>' +
            '<div class="skeleton-line skeleton-line-text short"></div>';
          container.appendChild(sk);
        }
      }

      async function showPage(requestedPage = 1) {
        const token = ++lastLoadToken;
        const hasCache = window.storyLoader.hasRange(requestedPage, itemsPerPage);

        if (!hasCache) {
          renderSkeletons(itemsPerPage);
        }

        try {
          const result = await window.storyLoader.getPage(requestedPage, itemsPerPage);
          if (token !== lastLoadToken) return;

          currentPage = result.page;
          const stories = result.stories || [];

          if (!stories.length) {
            container.innerHTML = '<p>Истории пока недоступны. Загляните позже.</p>';
          } else {
            renderStories(stories);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }

          renderPagination(currentPage, result.totalPages, { fullyLoaded: result.fullyLoaded });
          window.storyLoader.prefetchNext(itemsPerPage);
        } catch (err) {
          if (token !== lastLoadToken) return;
          console.error('Ошибка загрузки историй:', err);
          container.innerHTML = '<p>Не удалось загрузить истории. Попробуйте обновить страницу.</p>';
        }
      }

      try {
        renderSkeletons(itemsPerPage);
        await showPage(1);
      } catch (err) {
        console.error('Ошибка загрузки историй:', err);
        container.innerHTML = '<p>Не удалось загрузить истории. Попробуйте обновить страницу.</p>';
      }

      // ---- Search: filters across all loaded chunks on the fly. ----
      const searchForm  = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      if (searchForm && searchInput) {
        searchForm.addEventListener('submit', (e) => e.preventDefault());

        let searchToken = 0;
        let searchDebounce;

        const renderSearchResults = (matches, query) => {
          container.replaceChildren();
          if (!matches.length) {
            const empty = document.createElement('p');
            empty.className = 'search-empty';
            empty.textContent = 'По запросу «' + query + '» ничего не найдено.';
            container.appendChild(empty);
            pagination.replaceChildren();
            return;
          }
          matches.slice(0, 60).forEach((story, i) => container.appendChild(createStoryCard(story, i)));
          pagination.replaceChildren();
          const note = document.createElement('p');
          note.className = 'search-note';
          note.textContent = 'Найдено: ' + matches.length + ' (показаны первые ' + Math.min(60, matches.length) + ')';
          pagination.appendChild(note);
        };

        const doSearch = async (raw) => {
          const query = raw.trim().toLowerCase();
          const token = ++searchToken;
          if (!query) {
            await showPage(1);
            return;
          }
          renderSkeletons(6);
          await window.storyLoader.ensureMinimumStories(Number.MAX_SAFE_INTEGER);
          if (token !== searchToken) return;
          const stories = window.storyLoader.getLoadedStories();
          const matches = stories.filter((s) =>
            (s.title || '').toLowerCase().includes(query) ||
            (s.excerpt || '').toLowerCase().includes(query)
          );
          if (window.gaTrack) window.gaTrack('search', { search_term: query, results: matches.length });
          renderSearchResults(matches, raw.trim());
        };

        searchInput.addEventListener('input', (e) => {
          const value = e.target.value;
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(() => doSearch(value), 250);
        });
      }
    });
  </script>
